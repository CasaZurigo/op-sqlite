name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build libsql for Android from the pinned fork
        run: |
          cargo install cargo-ndk --locked
          # Clone the pinned libsql source first; the build script reuses it.
          mkdir -p build
          spec="$(tr -d ' \n' < LIBSQL_SOURCE)"
          repo="${spec%@*}"
          ref="${spec#*@}"
          git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" build/libsql
          # The cloned checkout pins its own toolchain; install the Android
          # targets there, not on the runner's default toolchain.
          TC="$(cd build/libsql && rustup show active-toolchain | awk '{print $1}')"
          rustup toolchain install "$TC" --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            x86_64-linux-android i686-linux-android --toolchain "$TC"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          ./scripts/build-libsql.sh

      - name: Compute the next patch tag
        id: version
        run: |
          VERSION="$(
            gh api repos/OP-Engineering/op-sqlite/tags --paginate --jq '.[].name' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          )"
          CZ_NUMBER="$(
            git tag --list '*-cz.*' --format='%(refname:short)' \
              | sed -E 's/.*-cz\.([0-9]+)$/\1/' | sort -n | tail -1
          )"
          CZ_NUMBER="${CZ_NUMBER:-0}"
          echo "tag=$VERSION-cz.$((CZ_NUMBER + 1))" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit, tag, and release
        run: |
          git config user.name "casa-zurigo-ci"
          git config user.email "ci@casazuri.ch"
          git add android/src/main/jniLibs
          if git diff --cached --quiet; then
            echo "jniLibs unchanged; skipping release"
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          git commit -m "Rebuild libsql jniLibs for $TAG"
          git tag "$TAG"
          git push origin main "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "op-sqlite with local-first libsql Android libraries built from CasaZurigo/libsql@main ($GITHUB_SHA)."
        env:
          GH_TOKEN: ${{ github.token }}
