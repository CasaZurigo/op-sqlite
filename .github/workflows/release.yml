name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Build libsql for Android from the pinned fork
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          ./scripts/build-libsql.sh

      - name: Compute the next patch tag
        id: version
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          CZ_NUMBER="$(
            git tag --list '*-cz.*' --sort=-v:refname \
              | head -1 | sed -E 's/.*-cz\.([0-9]+)$/\1/'
          )"
          CZ_NUMBER="${CZ_NUMBER:-0}"
          echo "tag=$VERSION-cz.$((CZ_NUMBER + 1))" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit, tag, and release
        run: |
          git config user.name "casa-zurigo-ci"
          git config user.email "ci@casazuri.ch"
          git add android/src/main/jniLibs
          if git diff --cached --quiet; then
            echo "jniLibs unchanged; skipping release"
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          git commit -m "Rebuild libsql jniLibs for $TAG"
          git tag "$TAG"
          git push origin main "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "op-sqlite with local-first libsql Android libraries built from CasaZurigo/libsql@main ($GITHUB_SHA)."
        env:
          GH_TOKEN: ${{ github.token }}
