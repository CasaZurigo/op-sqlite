name: Sync upstream

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "casa-zurigo-ci"
          git config user.email "ci@casazuri.ch"
          git config merge.ours.driver true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main --tags --force
          git merge upstream/main --no-edit

          # Mirror the upstream package version; release tags are built on it.
          UPSTREAM_VERSION="$(
            curl -fsSL https://raw.githubusercontent.com/OP-Engineering/op-sqlite/main/package.json \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))"
          )"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$UPSTREAM_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git add package.json
          git diff --cached --quiet || git commit -m "Mirror upstream version $UPSTREAM_VERSION"

          git push origin main
        env:
          UPSTREAM_URL: ${{ vars.UPSTREAM_URL }}

      - name: Open an issue on merge conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream merge conflict (${new Date().toISOString().slice(0, 10)})`,
              body: "The weekly upstream merge failed. Resolve the conflict on `main` manually (vendored binaries under `android/src/main/jniLibs` keep our local-first build), then re-run this workflow.",
            })
